# ------------------------------------------------------------
# General settings
# ------------------------------------------------------------
seed: 42

# ------------------------------------------------------------
# Data settings
# ------------------------------------------------------------
data:
  manifest_path: data/manifest.csv   # where the combined table is saved
  splits: [train, val, test]         # the three splits every dataset has

  languages:
    hindi:
      format: iiit_hw_dev            # label lines: "path word"
      folder: data/hindi
    bengali:
      format: iiit_indic             # label lines: "path, vocab_id"
      folder: data/bengali
    tamil:
      format: iiit_indic
      folder: data/tamil

# ------------------------------------------------------------
# Preprocessing settings
# ------------------------------------------------------------
preprocess:
  height: 64                                       # every image is resized to this height
  output_folder: data/processed                    # where processed images are saved
  processed_manifest_path: data/manifest_processed.csv
  num_workers: 12                                  # CPU cores to use at once

# ------------------------------------------------------------
# Script classifier 
# ------------------------------------------------------------
script_classifier:
  window_width: 128      # width of the window the model sees
  batch_size: 128        # images per batch
  num_workers: 8         # DataLoader helper processes
  channels: [32, 64, 128, 256]   # filters in each of the four Conv blocks
  dropout: 0.3                   # fraction of values switched off during training
  epochs: 10                                     # full passes through the training data
  learning_rate: 0.001                           # starting step size (lowered by the schedule)
  checkpoint_path: checkpoints/script_classifier.pt
  log_dir: outputs/runs/script_classifier        # where TensorBoard logs are saved


# ------------------------------------------------------------
# Handwriting recognizer (Phase 3)
# ------------------------------------------------------------
recognizer:
  language: bengali                              # which script to train on
  charset_path: checkpoints/charset_bengali.json # where the character set is saved
  batch_size: 64                                 # words per batch
  num_workers: 8                                 # DataLoader helper processes
  width_reduction: 4                             # how much the CRNN shrinks the width
  augment:
    rotation: 2              # maximum rotation, in degrees
    shear: 10                # maximum slant, in degrees
    width_scale: [0.9, 1.1]  # random width stretch: 90% to 110%
